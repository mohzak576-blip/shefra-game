<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Mohzak">
    <meta name="copyright" content="Copyright © 2026 Mohzak. All rights reserved.">
    <meta name="google-site-verification" content="zFY9i9pAuV6d5rdM7Q2ere71WBEhgnsXfCnXPh9ngiQ" />
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9297059128747721"
     crossorigin="anonymous"></script>
    <title>شيفرة - لعبة الشفرات الخفية أونلاين</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-color: #03060f;
            --card-bg: rgba(13, 18, 32, 0.75);
            --accent-cyan: #00f0ff;
            --accent-magenta: #ff0055;
            --accent-gold: #ffcc00;
            --text-main: #e2e8f0;
            --team-blue: #00d2ff;
            --team-red: #ff2a6d;
            --neutral-card: #283344;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            background-image: 
                radial-gradient(circle at 50% 5%, rgba(0, 240, 255, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(255, 0, 85, 0.08) 0%, transparent 40%),
                linear-gradient(rgba(3, 6, 15, 0.88), rgba(3, 6, 15, 0.88));
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px),
                linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .main-container { width: 100%; max-width: 1150px; z-index: 2; display: flex; flex-direction: column; align-items: center; }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 4, 10, 0.96); backdrop-filter: blur(15px);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 300;
        }

        .login-card {
            background: linear-gradient(145deg, rgba(15, 23, 42, 0.9) 0%, rgba(8, 12, 22, 0.95) 100%);
            border: 2px solid var(--accent-cyan);
            border-radius: 24px; padding: 35px 30px; width: 100%; max-width: 500px; text-align: center;
            box-shadow: 0 0 50px rgba(0, 240, 255, 0.3);
        }

        .login-card h2 { font-size: 2.8rem; font-weight: 900; color: #fff; margin-bottom: 6px; text-shadow: 0 0 20px rgba(0, 240, 255, 0.7); }

        .input-cyber {
            width: 100%; padding: 13px; background: #04060b; border: 1px solid rgba(0, 240, 255, 0.35);
            border-radius: 10px; color: #fff; font-size: 1.05rem; text-align: center; outline: none; margin-bottom: 12px;
            transition: all 0.3s;
        }
        .input-cyber:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.5), inset 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .team-select-group { display: flex; gap: 12px; margin-bottom: 15px; }
        .btn-team-cyber { flex: 1; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; border: 2px solid transparent; color: #fff; }
        .btn-team-cyber.blue { background: rgba(0, 210, 255, 0.1); border-color: var(--team-blue); color: var(--team-blue); }
        .btn-team-cyber.red { background: rgba(255, 42, 109, 0.1); border-color: var(--team-red); color: var(--team-red); }
        .btn-team-cyber.blue.active { background: var(--team-blue); color: #000; font-weight: 900; box-shadow: 0 0 20px var(--team-blue); }
        .btn-team-cyber.red.active { background: var(--team-red); color: #fff; font-weight: 900; box-shadow: 0 0 20px var(--team-red); }

        .leader-checkbox-container { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 18px; color: var(--accent-gold); font-weight: bold; }

        .btn-launch {
            width: 100%; padding: 14px; background: linear-gradient(90deg, #00d2ff, #00f0ff); border: none;
            border-radius: 10px; color: #000; font-size: 1.15rem; font-weight: 900; cursor: pointer;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 10px;
        }
        .btn-launch:hover { transform: translateY(-2px); box-shadow: 0 0 35px rgba(0, 240, 255, 0.8); }

        .btn-create-room {
            width: 100%; padding: 12px; background: rgba(255, 204, 0, 0.15); border: 2px solid var(--accent-gold);
            border-radius: 10px; color: var(--accent-gold); font-size: 1.05rem; font-weight: bold; cursor: pointer;
            transition: all 0.2s; margin-bottom: 10px;
        }
        .btn-create-room:hover { background: var(--accent-gold); color: #000; box-shadow: 0 0 20px rgba(255, 204, 0, 0.5); }

        .created-room-box {
            display: none;
            background: rgba(4, 6, 12, 0.9);
            border: 2px dashed var(--accent-gold);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
        }

        .created-room-box .code-text {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--accent-cyan);
            letter-spacing: 4px;
            margin: 8px 0;
        }

        .btn-copy-link {
            width: 100%; padding: 10px; background: var(--accent-gold); border: none;
            border-radius: 8px; color: #000; font-weight: 900; cursor: pointer; font-size: 0.95rem;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.4); margin-top: 5px;
        }

        .scoreboard { display: flex; justify-content: space-between; width: 100%; margin-bottom: 15px; gap: 15px; }
        .team-box { flex: 1; background: var(--card-bg); padding: 14px 20px; border-radius: 16px; border: 2px solid rgba(255,255,255,0.1); text-align: center; }
        .team-box.team-blue { border-color: rgba(0, 210, 255, 0.4); }
        .team-box.team-red { border-color: rgba(255, 42, 109, 0.4); }
        .team-box.active-turn { box-shadow: 0 0 30px currentColor; }

        .game-status-bar {
            width: 100%; background: var(--card-bg); border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 16px; padding: 14px 22px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; flex-wrap: wrap; gap: 15px;
        }

        .timer-container { display: flex; flex-direction: column; align-items: center; background: rgba(4, 6, 12, 0.8); border: 1px solid rgba(0, 240, 255, 0.4); border-radius: 12px; padding: 6px 20px; min-width: 150px; }
        .timer-display { font-size: 1.4rem; font-weight: 900; color: var(--accent-cyan); font-family: monospace; }
        .timer-progress-bar { width: 100%; height: 5px; background: #151d2a; border-radius: 3px; margin-top: 4px; overflow: hidden; }
        .timer-progress-fill { height: 100%; background: var(--accent-cyan); width: 100%; transition: width 1s linear; }

        .leader-control-panel {
            width: 100%; background: linear-gradient(135deg, rgba(255, 204, 0, 0.08) 0%, rgba(20, 16, 5, 0.8) 100%);
            border: 2px dashed var(--accent-gold); border-radius: 16px; padding: 16px 22px; margin-bottom: 18px; display: none; align-items: center; gap: 15px; flex-wrap: wrap;
        }

        .grid-container { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; width: 100%; margin-bottom: 25px; }
        .card {
            background: var(--card-bg); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; height: 70px;
            display: flex; align-items: center; justify-content: center; font-size: 0.95rem; font-weight: bold; cursor: pointer; text-align: center; padding: 6px;
            transition: all 0.25s;
        }
        .card:hover { border-color: var(--accent-cyan); transform: translateY(-3px) scale(1.02); }

        .card.revealed-blue { background: linear-gradient(135deg, #00d2ff, #0088cc) !important; color: #000 !important; font-weight: 900; }
        .card.revealed-red { background: linear-gradient(135deg, #ff2a6d, #b8003f) !important; color: #fff !important; font-weight: 900; }
        .card.revealed-neutral { background: var(--neutral-card) !important; color: #94a3b8 !important; }
        .card.revealed-black { background: #000 !important; color: #ff0055 !important; border: 2px solid #ff0055 !important; font-weight: 900; }
        .card.leader-view-black { background: #090204 !important; color: #ff0055 !important; border: 2px solid #ff0055 !important; }

        .copyright-footer {
            margin-top: auto; padding: 15px; text-align: center; font-size: 0.85rem; color: #64748b;
            border-top: 1px solid rgba(0, 240, 255, 0.1); width: 100%; max-width: 1150px;
        }
        .copyright-footer strong { color: var(--accent-cyan); }

        @media (max-width: 900px) { .grid-container { grid-template-columns: repeat(4, 1fr); } .card { height: 58px; font-size: 0.85rem; } }
    </style>
</head>
<body>

    <div class="overlay" id="login-overlay">
        <div class="login-card">
            <h2>شيفرة</h2>
            <div style="color: #8a99ad; font-size: 0.85rem; margin-bottom: 20px;">أدخل اسمك، رمز الغرفة، وحدد فريقك ودورك</div>

            <input type="text" id="room-id-input" class="input-cyber" placeholder="رمز الغرفة (مثال: 1234)" value="">
            <input type="text" id="player-name-input" class="input-cyber" placeholder="اسمك الكريم..." autofocus>

            <div class="created-room-box" id="created-room-box">
                <div style="color: var(--accent-gold); font-size: 0.85rem; font-weight: bold;">🎉 تم إنشاء الغرفة بنجاح!</div>
                <div class="code-text" id="display-room-code">----</div>
                <button class="btn-copy-link" onclick="copyRoomLink()">📋 نسخ رابط الغرفة للأصدقاء</button>
            </div>

            <div class="team-select-group">
                <button class="btn-team-cyber blue active" id="btn-select-blue" onclick="selectTeam('blue')">🔵 الفريق الأزرق</button>
                <button class="btn-team-cyber red" id="btn-select-red" onclick="selectTeam('red')">🔴 الفريق الأحمر</button>
            </div>

            <div class="leader-checkbox-container">
                <input type="checkbox" id="is-leader-check" style="transform: scale(1.2); cursor: pointer;">
                <label for="is-leader-check" style="cursor: pointer;">👑 أنا قائد الفريق (Spymaster)</label>
            </div>

            <button class="btn-launch" onclick="enterGame()">الانضمام إلى الغرفة 🚀</button>
            <button class="btn-create-room" onclick="generateNewRoom()">إنشاء غرفة جديدة 🎮</button>
        </div>
    </div>

    <div class="main-container">

        <div class="scoreboard">
            <div class="team-box team-blue" id="box-blue">
                <div style="font-weight: bold; color: var(--team-blue);">الفريق الأزرق</div>
                <div style="font-size: 1.8rem; font-weight: 900;" id="score-blue">0 / 16</div>
            </div>
            <div class="team-box team-red" id="box-red">
                <div style="font-weight: bold; color: var(--team-red);">الفريق الأحمر</div>
                <div style="font-size: 1.8rem; font-weight: 900;" id="score-red">0 / 15</div>
            </div>
        </div>

        <div class="game-status-bar">
            <div>
                <span style="color: #8a99ad;">التلميح: </span>
                <span id="clue-status-text" style="font-weight: 900; color: var(--accent-gold);">في انتظار التلميح...</span>
            </div>

            <div class="timer-container">
                <span style="font-size: 0.75rem; color: #8a99ad;">⏰ وقت التفكير</span>
                <div class="timer-display" id="timer-display">03:00</div>
                <div class="timer-progress-bar"><div class="timer-progress-fill" id="timer-progress-fill"></div></div>
            </div>

            <div>
                <span style="color: #8a99ad;">الدور: </span>
                <strong id="turn-indicator" style="color: var(--team-blue);">🔵 الفريق الأزرق</strong>
            </div>
        </div>

        <div class="leader-control-panel" id="leader-panel">
            <span style="color: var(--accent-gold); font-weight: bold;">👑 لوحة القائد:</span>
            <input type="text" id="leader-clue-word" class="input-cyber" style="width: 180px; margin: 0;" placeholder="كلمة التلميح...">
            <select id="leader-clue-count" class="input-cyber" style="width: 100px; margin: 0;">
                <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
            </select>
            <button style="background: var(--accent-gold); border: none; padding: 10px 18px; font-weight: bold; border-radius: 8px; cursor: pointer;" onclick="submitClue()">إرسال 📢</button>
        </div>

        <div style="margin-bottom: 15px;" id="player-controls">
            <button style="background: var(--accent-magenta); color: #fff; border: none; padding: 10px 20px; font-weight: bold; border-radius: 8px; cursor: pointer;" onclick="endTurn()">⏭️ إنهاء الدور</button>
        </div>

        <div class="grid-container" id="grid"></div>

        <div class="copyright-footer">
            جميع الحقوق محفوظة © 2026 | تم التطوير والتصميم بواسطة: <strong>Mohzak</strong>
        </div>

    </div>

    <script>
        let socket;
        try {
            socket = io();
        } catch(e) {
            console.error("Socket.io connection error:", e);
        }

        let roomId = '';
        let playerData = { name: '', team: 'blue', isLeader: false };
        let currentGameState = null;

        // قراءة رمز الغرفة من رابط URL إن وجد بشكل آمن
        try {
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                const roomInput = document.getElementById('room-id-input');
                if(roomInput) roomInput.value = roomParam;
                roomId = roomParam;
            }
        } catch(err) {
            console.error(err);
        }

        function selectTeam(team) {
            playerData.team = team;
            document.getElementById('btn-select-blue').classList.toggle('active', team === 'blue');
            document.getElementById('btn-select-red').classList.toggle('active', team === 'red');
        }

        function generateNewRoom() {
            const newCode = Math.floor(1000 + Math.random() * 9000).toString();
            document.getElementById('room-id-input').value = newCode;
            document.getElementById('display-room-code').innerText = newCode;
            document.getElementById('created-room-box').style.display = 'block';
            roomId = newCode;
        }

        function copyRoomLink() {
            const code = document.getElementById('room-id-input').value.trim();
            if (!code) return;
            
            const link = window.location.origin + window.location.pathname + '?room=' + code;
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(link).catch(() => {});
            }
        }

        function enterGame() {
            const name = document.getElementById('player-name-input').value.trim();
            const room = document.getElementById('room-id-input').value.trim();

            if (!name || !room) { alert('ادخل اسمك ورمز الغرفة أولاً!'); return; }

            playerData.name = name;
            roomId = room;
            playerData.isLeader = document.getElementById('is-leader-check').checked;

            document.getElementById('login-overlay').style.display = 'none';

            if (playerData.isLeader) {
                document.getElementById('leader-panel').style.display = 'flex';
                document.getElementById('player-controls').style.display = 'none';
            }

            if (socket) {
                socket.emit('joinRoom', { roomId, playerName: name, team: playerData.team, isLeader: playerData.isLeader });
            }
        }

        function submitClue() {
            if (!currentGameState || !socket) return;
            if (playerData.team !== currentGameState.currentTurn) return;

            const word = document.getElementById('leader-clue-word').value.trim();
            const count = document.getElementById('leader-clue-count').value;
            if (!word) { alert('اكتب كلمة التلميح أولاً!'); return; }

            socket.emit('submitClue', { roomId, word, count });
            document.getElementById('leader-clue-word').value = '';
        }

        function endTurn() {
            if (!currentGameState || !socket) return;
            if (playerData.team !== currentGameState.currentTurn) return;

            socket.emit('endTurn', { roomId });
        }

        function revealCard(index) {
            if (!currentGameState || !socket) return;

            if (playerData.isLeader) return;
            if (currentGameState.cards[index] && currentGameState.cards[index].revealed) return;
            if (playerData.team !== currentGameState.currentTurn) return;

            socket.emit('revealCard', { roomId, index });
        }

        if (socket) {
            socket.on('updateGameState', (gameState) => {
                currentGameState = gameState;

                document.getElementById('score-blue').innerText = `${gameState.scoreBlue} / 16`;
                document.getElementById('score-red').innerText = `${gameState.scoreRed} / 15`;
                document.getElementById('clue-status-text').innerText = gameState.clue;

                const turnInd = document.getElementById('turn-indicator');
                if (gameState.currentTurn === 'blue') {
                    turnInd.innerText = "🔵 الفريق الأزرق"; turnInd.style.color = "var(--team-blue)";
                    document.getElementById('box-blue').classList.add('active-turn'); document.getElementById('box-red').classList.remove('active-turn');
                } else {
                    turnInd.innerText = "🔴 الفريق الأحمر"; turnInd.style.color = "var(--team-red)";
                    document.getElementById('box-red').classList.add('active-turn'); document.getElementById('box-blue').classList.remove('active-turn');
                }

                const grid = document.getElementById('grid');
                grid.innerHTML = '';

                gameState.cards.forEach((item, idx) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerText = item.word;

                    if (playerData.isLeader && !item.revealed) {
                        if (item.type === 'black') {
                            card.classList.add('leader-view-black');
                            card.innerText = item.word + " 💀";
                        } else {
                            card.style.borderBottom = `4px solid var(--team-${item.type === 'neutral' ? 'neutral' : item.type})`;
                        }
                    }

                    if (item.revealed) {
                        card.classList.add(`revealed-${item.type}`);
                        if (item.type === 'black') card.innerText = "💀 خـسـارة";
                    }

                    card.onclick = () => revealCard(idx);
                    grid.appendChild(card);
                });
            });

            socket.on('timerUpdate', ({ timer }) => {
                const minutes = Math.floor(timer / 60);
                const seconds = timer % 60;
                document.getElementById('timer-display').innerText = `${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                document.getElementById('timer-progress-fill').style.width = `${(timer / 180) * 100}%`;
            });
        }
    </script>
</body>
</html>
